<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09244c"><link rel="manifest" href="manifest.json"><title>POLARIS X Inventarios</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#102746;font:16px system-ui}header{background:#09244c;color:white;padding:24px}header b{font-size:25px;letter-spacing:2px}header small{display:block;color:#f6d34c}main{max-width:700px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:18px;margin-bottom:14px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}button,input,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #cbd5e1;min-width:0}button{background:#123d73;color:white;border:0;cursor:pointer}button.secondary{background:#e4ebf5;color:#123d73}label{display:block;font-size:13px;font-weight:650;margin-bottom:4px}input,select{width:100%;background:white;color:#102746}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.calc{background:#fff2b7;padding:14px;border-radius:10px;margin:14px 0}.calc b{font-size:25px}h2{margin:0 0 14px;font-size:20px}p{line-height:1.5}article{border-top:1px solid #dce3ec;padding:12px 0;overflow-wrap:anywhere}article button{margin:6px 6px 0 0}#status{color:#9b3100;white-space:pre-wrap}button:disabled{opacity:.5} </style><header><b>POLARIS X</b><small>INVENTARIOS · ALMACÉN</small></header><main><nav><button onclick="show('capture')">Capturar</button><button onclick="show('records')">Registros</button><button onclick="show('history')">Histórico</button><button onclick="show('catalog')">Configuración</button></nav><div id="status" role="status"></div><section id="capture"><h2>Levantamiento físico</h2><form id="form"><div class="grid"><div class="full"><label>Buscar producto</label><input id="search" placeholder="SKU o descripción" oninput="options()"><label>Producto / SKU</label><select id="sku" required onchange="calc()"></select></div><div><label>Pasillo *</label><input id="pas" type="number" min="0" step="1" required></div><div><label>Rack *</label><input id="rack" required></div><div><label>Ubicación *</label><input id="ubi" type="number" min="0" step="1" required></div><div><label>Pedimento (opcional)</label><input id="ped"></div><div><label>Tarimas completas</label><input id="tar" type="number" min="0" step="1" value="0" required oninput="calc()"></div><div><label>Saldos (cajas)</label><input id="sal" type="number" min="0" step="1" value="0" required oninput="calc()"></div></div><div class="grid"><div><label>Tipo de inventario</label><select id="kind" onchange="calc()"><option>DISPONIBLE</option><option>MERMA</option></select></div><div><label>Unidades individuales de merma</label><input id="loose" type="number" min="0" step="1" value="0" oninput="calc()"></div></div><div class="calc" id="totals"></div><button type="submit" id="save">Guardar y continuar</button> <button type="button" class="secondary" onclick="clearFields()">Limpiar campos</button></form></section><section id="records" hidden><h2>Capturas abiertas</h2><div id="list"></div><button onclick="downloadCurrent()">Exportar Excel</button> <button onclick="closeInventory()">Cerrar inventario</button></section><section id="history" hidden><h2>Inventarios cerrados</h2><div id="past"></div></section><section id="catalog" hidden><h2>Catálogo maestro</h2><p>Importa un XLSX con la hoja Catalogo Maestro y las mismas ocho columnas del original. Solo con el inventario abierto vacío.</p><input type="file" accept=".xlsx" onchange="importCatalog(this)"><button onclick="editProduct()">Agregar producto</button><form id="productForm" hidden><div id="productFields" class="grid"></div><button type="submit">Guardar producto</button> <button type="button" onclick="this.form.hidden=true">Cancelar</button></form><div id="products"></div></section></main><script src="data.js"></script><script src="app.js"></script></html>
